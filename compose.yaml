services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: user_management
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET in .env}
      JWT_ISSUER: backend-golang-assignment
      JWT_TTL_HOURS: 1
      HTTP_ADDR: :8080
volumes:
  mongo_data:
